<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- Page générée par tools/preview/make_preview.py : ne pas modifier à la main. -->
<style>
	:root { --bg: #17181b; --cell: #2a2b30; --text: #e8e6e1; --muted: #9a978f; --accent: #e0a24a; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
	header { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #0f1012; z-index: 2; }
	header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	header label { color: var(--muted); white-space: nowrap; cursor: pointer; }
	header .hint { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
	#view { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	.tag { position: absolute; padding: 4px 8px; background: rgba(0,0,0,.55); border-radius: 4px; cursor: pointer; user-select: none; }
	.tag b { color: var(--accent); font-size: 18px; margin-right: 6px; }
	#err { position: fixed; inset: 40px 0 0 0; display: none; padding: 24px; color: #f88; white-space: pre-wrap; }
	/* Mode intégré (spec "height") : hauteur fixe dans le flux, pour un affichage dans la conversation. */
	html.embed, html.embed body { height: auto; overflow: visible; background: none; }
	html.embed header { position: static; border-radius: 6px 6px 0 0; }
	html.embed #view { position: relative; top: 0; }
	html.embed #err { position: absolute; }
	@media (max-width: 900px) { header .hint { display: none; } }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
	<h1 id="title"></h1>
	<label><input type="checkbox" id="spin" checked> rotation</label>
	<label><input type="checkbox" id="fov"> FOV du jeu (90°)</label>
	<span class="hint">glisser : tourner · molette : zoom · clic sur un numéro : seul / grille</span>
</header>
<div id="view"></div>
<div id="err"></div>
<script type="application/json" id="data">__DATA__</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const DATA = JSON.parse(document.getElementById("data").textContent);
document.getElementById("title").textContent = DATA.title;
const view = document.getElementById("view");
if (DATA.height) {
	document.documentElement.classList.add("embed");
	view.style.height = DATA.height + "px";
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setScissorTest(true);
view.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;

// Une scène par variante, même éclairage : environnement neutre (reflets du métal) et soleil, proche de Roblox.
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

// Cette méthode permet de créer une texture three.js depuis une data URI lorsque la variante fournit une image
// (sRGB pour la couleur, données brutes pour les autres cartes, UV non retournées comme dans glTF).
const texCache = new Map();
function texture(uri, srgb) {
	const key = uri + srgb;
	if (!texCache.has(key)) {
		const t = new THREE.TextureLoader().load(uri);
		t.flipY = false;
		t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
		t.wrapS = t.wrapT = THREE.RepeatWrapping;
		t.anisotropy = 8;
		texCache.set(key, t);
	}
	return texCache.get(key);
}

// Cette méthode permet d'appliquer les cartes d'une variante à un matériau cloné lorsqu'on construit sa scène :
// image, teinte unie ou nombre, canal par canal.
function applyMaps(mat, maps) {
	if (!maps) return;
	if ("Color" in maps) {
		const v = maps.Color;
		if (v && v.img) { mat.map = texture(v.img, true); mat.color.set(0xffffff); }
		else if (typeof v === "string") { mat.map = null; mat.color.set(v); }
	}
	for (const [ch, slot, prop] of [["Rough", "roughnessMap", "roughness"], ["Metal", "metalnessMap", "metalness"]]) {
		if (!(ch in maps)) continue;
		const v = maps[ch];
		if (v && v.img) { mat[slot] = texture(v.img, false); mat[prop] = 1; }
		else if (typeof v === "number") { mat[slot] = null; mat[prop] = v; }
	}
	if ("Normal" in maps) mat.normalMap = maps.Normal && maps.Normal.img ? texture(maps.Normal.img, false) : null;
	mat.needsUpdate = true;
}

const cells = [];
let solo = null;

function layout() {
	const w = view.clientWidth, h = view.clientHeight;
	renderer.setSize(w, h, false);
	const shown = solo === null ? cells : [cells[solo]];
	let cols = 1;
	while (cols * Math.ceil(shown.length / cols) < shown.length || (w / cols) / (h / Math.ceil(shown.length / cols)) > 1.9) {
		if (cols >= shown.length) break;
		cols++;
	}
	const rows = Math.ceil(shown.length / cols);
	const cw = w / cols, ch = h / rows;
	cells.forEach((c) => { c.rect = null; c.tag.style.display = "none"; });
	shown.forEach((c, i) => {
		const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
		c.rect = { x, y, w: cw, h: ch };
		c.tag.style.display = "";
		c.tag.style.left = view.offsetLeft + x + 8 + "px";
		c.tag.style.top = view.offsetTop + y + 8 + "px";
	});
	frameCamera();
}

function frame() {
	controls.update();
	for (const c of cells) {
		if (!c.rect) continue;
		const { x, y, w, h } = c.rect;
		const by = view.clientHeight - y - h;
		renderer.setViewport(x + 1, by + 1, w - 2, h - 2);
		renderer.setScissor(x + 1, by + 1, w - 2, h - 2);
		camera.aspect = (w - 2) / (h - 2);
		camera.updateProjectionMatrix();
		renderer.render(c.scene, camera);
	}
	requestAnimationFrame(frame);
}

// Cadre la caméra sur le modèle : distance telle qu'il remplisse la cellule au FOV choisi.
let radius = 1, center = new THREE.Vector3();
function frameCamera() {
	const dir = camera.position.clone().sub(controls.target).normalize();
	if (dir.lengthSq() === 0 || !isFinite(dir.x)) dir.set(1, 0.35, 1).normalize();
	const cell = (cells.find((c) => c.rect) || {}).rect;
	const aspect = cell ? cell.w / cell.h : 1;
	const vfov = THREE.MathUtils.degToRad(camera.fov);
	const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
	const dist = radius / Math.sin(Math.min(vfov, hfov) / 2) * 0.85;
	controls.target.copy(center);
	camera.position.copy(center).addScaledVector(dir, dist);
	camera.near = dist / 100; camera.far = dist * 100;
}

document.getElementById("spin").onchange = (e) => { controls.autoRotate = e.target.checked; };
document.getElementById("fov").onchange = (e) => { camera.fov = e.target.checked ? 90 : 35; frameCamera(); };
window.addEventListener("resize", layout);

const bytes = Uint8Array.from(atob(DATA.glb), (c) => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, "", (gltf) => {
	const box = new THREE.Box3().setFromObject(gltf.scene);
	const sphere = box.getBoundingSphere(new THREE.Sphere());
	radius = sphere.radius; center.copy(sphere.center);
	DATA.variants.forEach((v, i) => {
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x2a2b30);
		scene.environment = env;
		const sun = new THREE.DirectionalLight(0xffffff, 2.2);
		sun.position.set(3, 5, 2);
		scene.add(sun, new THREE.HemisphereLight(0xdfe6ff, 0x3a3530, 0.6));
		const model = gltf.scene.clone(true);
		const mats = new Map();
		model.traverse((o) => {
			if (!o.isMesh) return;
			const src = o.material;
			if (!mats.has(src)) { const m = src.clone(); applyMaps(m, v.maps[src.name]); mats.set(src, m); }
			o.material = mats.get(src);
		});
		scene.add(model);
		const tag = document.createElement("div");
		tag.className = "tag";
		tag.innerHTML = `<b>${v.id}</b>`;
		tag.append(document.createTextNode(v.label));
		tag.onclick = () => { solo = solo === i ? null : i; layout(); };
		document.body.appendChild(tag);
		cells.push({ scene, tag, rect: null });
	});
	layout();
	frame();
}, (err) => {
	const e = document.getElementById("err");
	e.style.display = "block";
	e.textContent = "Modèle illisible : " + (err && err.message || err);
});
</script>
</body>
</html>
